[project]
name = "warp-beast"
version = "0.1.0"
description = ""
authors = [
    {name = "bragnart",email = "tyontyen@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flet (>=0.28.3,<0.29.0)",
    "pydantic-ai (>=1.26.0,<2.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "langchain (>=1.1.2,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "wikipedia (>=1.4.0,<2.0.0)",
    "ddgs (>=9.9.2,<10.0.0)",
    "pendulum (>=3.1.0,<4.0.0)",
    "mem0ai (>=1.0.1,<2.0.0)",
    "shortuuid (>=1.0.13,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
flet = {extras = ["all"], version = "^0.28.3"}
ruff = "^0.14.8"
bandit = "^1.9.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
